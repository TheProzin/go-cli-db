name: Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build & Upload Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o go-cli-db-${{ github.ref_name }}-${{ matrix.suffix }} \
            ./

      - name: Upload para a Release
        uses: softprops/action-gh-release@v2
        with:
          files: go-cli-db-${{ github.ref_name }}-${{ matrix.suffix }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}